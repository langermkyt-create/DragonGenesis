<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d1d">
<title>DRAGON GENESIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d1d;--panel:#121a30;--panel2:#192540;--gold:#f4cf83;--muted:#9ca9c7;--cyan:#74e7e1;--violet:#b9a1ff;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#29345c 0,#11182e 42%,#080c19 100%);color:#f5f2ff;font-family:Manrope,system-ui;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background-image:radial-gradient(2px 2px at 15% 20%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 70% 30%,#b8eaff 50%,transparent 60%),radial-gradient(2px 2px at 85% 75%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 35% 80%,#fff 50%,transparent 60%);background-size:240px 190px}.app{max-width:1120px;margin:auto;padding:20px 22px 100px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{font:800 20px Cinzel,serif;letter-spacing:2px;color:var(--gold)}.brand small{display:block;font:600 9px Manrope;letter-spacing:4px;color:#a9b5d1;margin-top:3px}.currency{display:flex;gap:8px}.pill{background:#18233d;border:1px solid var(--line);padding:9px 13px;border-radius:30px;color:#f6dfad;font-weight:800;font-size:12px}.hero{border:1px solid #ffffff20;border-radius:26px;overflow:hidden;position:relative;min-height:270px;background:linear-gradient(110deg,#131d38 0%,#1b3150 50%,#3c3d65 100%);box-shadow:0 24px 80px #0007}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 76% 44%,#f0c67b55,transparent 35%),linear-gradient(90deg,#101a33 5%,#101a33bb 44%,transparent 100%)}.heroText{position:relative;padding:32px;max-width:520px;z-index:2}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--cyan);font-weight:800}.hero h1{font:700 clamp(27px,5vw,48px) Cinzel,serif;line-height:1.1;margin:12px 0;color:#fff4d8}.hero p{color:#c1cce4;max-width:400px;font-size:13px;line-height:1.7}.dragonArt{position:absolute;right:5%;top:5%;width:39%;height:90%;display:grid;place-items:center;font-size:clamp(115px,22vw,230px);filter:drop-shadow(0 20px 25px #0009);animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}.btn{border:1px solid #f4cf8377;background:linear-gradient(135deg,#f4d99a,#b9864e);color:#20182a;padding:12px 18px;border-radius:13px;font:800 12px Manrope;cursor:pointer;box-shadow:0 7px 20px #d39b4b25}.btn.secondary{background:#ffffff0c;color:#e9e5ff;border-color:#ffffff24;box-shadow:none}.btn:active{transform:scale(.98)}.nav{display:flex;gap:8px;overflow:auto;padding:17px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#111a30;color:#aebbd6;padding:11px 15px;border-radius:12px;font-weight:800;font-size:12px;cursor:pointer}.tab.active{background:#283754;color:var(--gold);border-color:#e5c17a88}.section{margin-top:12px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin:18px 0 12px}.sectionHead h2{font:700 19px Cinzel;margin:0;color:#f4dfb4}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:linear-gradient(145deg,#18243d,#10182c);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 35px #0003}.dragonCard{position:relative;overflow:hidden;min-height:190px}.dragonCard:after{content:"";position:absolute;width:150px;height:150px;right:-40px;top:-35px;border-radius:50%;background:var(--glow,#6ed8d855);filter:blur(35px);pointer-events:none}.dragonEmoji{font-size:68px;text-align:center;padding:10px;filter:drop-shadow(0 8px 12px #0008);position:relative;z-index:1}.dragonName{font:700 16px Cinzel;color:#fff0d2}.rarity{font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-top:5px}.stats{display:flex;gap:7px;margin-top:12px}.stat{flex:1;background:#ffffff09;border-radius:9px;padding:8px;text-align:center;font-size:10px;color:var(--muted)}.stat b{display:block;color:#fff;font-size:14px}.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.part{background:#0c1427;border-radius:9px;padding:8px 5px;font-size:10px;color:#b9c5df;text-align:center}.part b{display:block;color:#f4d99a;margin-top:4px;font-size:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions .btn{flex:1}.wide{grid-column:1/-1}.notice{padding:13px 15px;border:1px solid #74e7e133;background:#74e7e10d;border-radius:13px;color:#b9d9df;font-size:12px;line-height:1.6;margin:12px 0}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.egg{font-size:56px}.bar{height:7px;background:#ffffff15;border-radius:20px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#78e5d9,#e6ca83);border-radius:20px}.collection{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.set{background:linear-gradient(145deg,#282344,#141c34);border:1px solid #b69aff44;border-radius:15px;padding:14px;text-align:center}.set .icon{font-size:34px}.set h3{font:700 13px Cinzel;color:#ead8ff}.set p{font-size:10px;color:var(--muted)}.bottomNote{text-align:center;color:#667391;font-size:10px;margin-top:35px}.hidden{display:none!important}@media(max-width:650px){.app{padding:14px 13px 90px}.hero{min-height:255px}.heroText{padding:24px 20px;max-width:70%}.hero p{font-size:11px}.dragonArt{right:-2%;width:42%;font-size:125px;opacity:.9}.top{margin-bottom:12px}.brand{font-size:16px}.pill{padding:8px 10px}.grid{grid-template-columns:1fr 1fr}.dragonCard{padding:12px;min-height:185px}.dragonEmoji{font-size:55px}.actions .btn{padding:11px 9px;font-size:11px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.heroText{max-width:76%}.dragonArt{right:-8%;opacity:.7}}
</style><link rel="stylesheet" href="world.css?v=2"></head>
<body><main class="app">
<header class="top"><div class="brand">DRAGON GENESIS<small>THE ART OF CREATION</small></div><div class="currency"><div class="pill">✦ <span id="gems">120</span></div><div class="pill">◈ <span id="food">80</span></div></div></header>
<section class="hero"><div class="heroText"><div class="eyebrow">✧ YOUR LEGACY BEGINS ✧</div><h1>РОДИ НОВУЮ<br>ЛЕГЕНДУ</h1><p>Выводи невероятных драконов, открывай древние мутации и создай коллекцию, которой будут восхищаться целые королевства.</p><button class="btn" onclick="showTab('nursery')">В питомник　✦</button></div><div class="dragonArt">🐉</div></section>
<nav class="nav"><button class="tab active" data-tab="home" onclick="showTab('home')">⌂ Главная</button><button class="tab" data-tab="nursery" onclick="showTab('nursery')">🐉 Питомник</button><button class="tab" data-tab="breed" onclick="showTab('breed')">✧ Разведение</button><button class="tab" data-tab="arena" onclick="showTab('arena')">⚔ Арена</button><button class="tab" data-tab="collection" onclick="showTab('collection')">♢ Коллекция</button></nav>
<div id="view"></div><div class="bottomNote">DRAGON GENESIS · Каждый ген хранит свою историю</div></main>
<script>
const rarities=[{n:'Обычная',c:'#aeb8c9',w:35},{n:'Необычная',c:'#72d7a2',w:25},{n:'Редкая',c:'#62c5f0',w:18},{n:'Эпическая',c:'#b69aff',w:12},{n:'Легендарная',c:'#f0bd65',w:7},{n:'Мифическая',c:'#ff83c5',w:2.5},{n:'Божественная',c:'#fff0a1',w:.5}];
const sets=[{id:'ember',name:'Пламя перворождённых',icon:'🔥',parts:['Пепельный венец','Хвост феникса','Крылья лавы']},{id:'frost',name:'Сердце вечной зимы',icon:'❄️',parts:['Корона инея','Хвост ледяного змея','Крылья метели']},{id:'astral',name:'Астральный странник',icon:'🌌',parts:['Звёздный лик','Хвост кометы','Крылья созвездий']},{id:'abyss',name:'Бездна',icon:'🌑',parts:['Маска бездны','Шипастый хвост','Крылья сумрака']}];
const names=['Искра','Нимбус','Азур','Пепел','Люмен','Вихрь','Сапфир','Комета','Оникс','Туман'];let state=JSON.parse(localStorage.getItem('dg-save')||'null')||{gems:120,food:80,dragons:[{id:1,name:'Искра',head:'Юный гребень',tail:'Гибкий хвост',wings:'Малые крылья',rarity:'Обычная',power:42,level:1,genes:[]},{id:2,name:'Азур',head:'Кристальный лоб',tail:'Хвост прилива',wings:'Лазурные крылья',rarity:'Необычная',power:48,level:1,genes:[]}],next:3,wins:0};let selectedA=1,selectedB=2;
function save(){localStorage.setItem('dg-save',JSON.stringify(state));document.getElementById('gems').textContent=state.gems;document.getElementById('food').textContent=state.food}
function pickRarity(){let n=Math.random()*100;for(const r of rarities){n-=r.w;if(n<=0)return r}return rarities[0]}
function partMutation(slot){const set=sets[Math.floor(Math.random()*sets.length)];const idx=slot==='head'?0:slot==='tail'?1:2;return set.parts[idx]}
function showTab(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));const v=document.getElementById('view');if(tab==='home')v.innerHTML=home();if(tab==='nursery')v.innerHTML=nursery();if(tab==='breed')v.innerHTML=breed();if(tab==='arena')v.innerHTML=arena();if(tab==='collection')v.innerHTML=collection();save()}
function home(){return `<section class="section"><div class="sectionHead"><h2>ТВОЯ ДРАКОНЬЯ СЕМЬЯ</h2><span class="muted">${state.dragons.length} дракона</span></div><div class="grid"><div class="card"><div class="muted">СОБРАНО ДРАКОНОВ</div><div style="font:700 34px Cinzel;color:var(--gold);margin-top:7px">${state.dragons.length}</div><div class="bar"><span style="width:${Math.min(100,state.dragons.length*8)}%"></span></div></div><div class="card"><div class="muted">ПОБЕДЫ НА АРЕНЕ</div><div style="font:700 34px Cinzel;color:var(--cyan);margin-top:7px">${state.wins}</div><div class="muted">Каждая битва — новый опыт</div></div><div class="card wide"><div class="sectionHead"><h2>✨ Последние открытия</h2><span class="muted">Твои драконы</span></div><div class="grid">${state.dragons.slice(-2).map(dragonCard).join('')}</div></div></div><div class="notice">✧ Совет хранителя: скрещивай драконов с разными генами. Каждая часть тела может получить собственную мутацию, а полный комплект одного древнего набора откроет особую карточку.</div></section>`}
function dragonCard(d){return `<article class="card dragonCard" style="--glow:${(rarities.find(r=>r.n===d.rarity)||rarities[0]).c}55"><div class="dragonEmoji">🐲</div><div class="dragonName">${d.name}</div><div class="rarity" style="color:${(rarities.find(r=>r.n===d.rarity)||rarities[0]).c}">${d.rarity}</div><div class="parts"><div class="part">ГОЛОВА<b>${d.head}</b></div><div class="part">ХВОСТ<b>${d.tail}</b></div><div class="part">КРЫЛЬЯ<b>${d.wings}</b></div></div><div class="stats"><div class="stat"><b>${d.power}</b>СИЛА</div><div class="stat"><b>${d.level}</b>УРОВЕНЬ</div></div></article>`}
function nursery(){return `<section class="section"><div class="sectionHead"><h2>ПИТОМНИК</h2><span class="muted">Твои спутники</span></div><div class="grid">${state.dragons.map(dragonCard).join('')}</div></section>`}
function breed(){return `<section class="section"><div class="sectionHead"><h2>ГЕНЕТИЧЕСКАЯ КАМЕРА</h2><span class="muted">Наследие поколений</span></div><div class="notice">Шанс мутации каждой части — <b>35%</b>. При мутации редкость определяется отдельно: обычная 35%, необычная 25%, редкая 18%, эпическая 12%, легендарная 7%, мифическая 2,5%, божественная 0,5%.</div><div class="grid"><div class="card"><label class="muted">ПЕРВЫЙ РОДИТЕЛЬ</label><select id="parentA" style="width:100%;margin-top:8px;padding:12px;background:#0d172b;color:white;border:1px solid var(--line);border-radius:10px">${state.dragons.map(d=>`<option value="${d.id}" ${d.id===selectedA?'selected':''}>${d.name} · ${d.rarity}</option>`).join('')}</select></div><div class="card"><label class="muted">ВТОРОЙ РОДИТЕЛЬ</label><select id="parentB" style="width:100%;margin-top:8px;padding:12px;background:#0d172b;color:white;border:1px solid var(--line);border-radius:10px">${state.dragons.map(d=>`<option value="${d.id}" ${d.id===selectedB?'selected':''}>${d.name} · ${d.rarity}</option>`).join('')}</select></div></div><div class="card" style="text-align:center;margin-top:13px"><div style="font-size:54px">🥚</div><h3 style="font:700 18px Cinzel;color:var(--gold)">СОЗДАТЬ НОВУЮ ЖИЗНЬ</h3><p class="muted">Стоимость: 15 ✦ · 10 ◈</p><button class="btn" onclick="breedNow()">Запустить скрещивание ✧</button></div><div id="breedResult"></div></section>`}
function breedNow(){const a=state.dragons.find(d=>d.id==+document.getElementById('parentA').value),b=state.dragons.find(d=>d.id==+document.getElementById('parentB').value);if(!a||!b||a.id===b.id){alert('Выбери двух разных родителей');return}if(state.gems<15||state.food<10){alert('Не хватает ресурсов');return}state.gems-=15;state.food-=10;const child={id:state.next++,name:names[Math.floor(Math.random()*names.length)],level:1,genes:[],power:35+Math.floor(Math.random()*16)};let muts=[];for(const slot of ['head','tail','wings']){let val=Math.random()<.35?partMutation(slot):([a[slot],b[slot]][Math.floor(Math.random()*2)]);if(val!==a[slot]&&val!==b[slot]){let r=pickRarity();child.rarity=r.n;child.genes.push({slot,name:val,rarity:r.n});muts.push(slot+' · '+val+' ('+r.n+')')}child[slot]=val}if(!child.rarity)child.rarity='Обычная';const matched=sets.find(s=>s.parts.every(p=>[child.head,child.tail,child.wings].includes(p)));if(matched){child.set=matched.id;child.power+=22}state.dragons.push(child);save();document.getElementById('breedResult').innerHTML=`<div class="card" style="margin-top:14px;text-align:center"><div style="font-size:55px">🐣</div><div class="eyebrow">НОВОЕ ПОКОЛЕНИЕ</div><h2 style="font:700 23px Cinzel;color:var(--gold)">${child.name}</h2><p class="muted">${muts.length? 'Обнаружены изменения: '+muts.join(' · '):'Наследование прошло без новых мутаций.'}</p>${matched?'<div class="notice">✦ ПОЛНЫЙ НАБОР! Открыта коллекционная карточка!</div>':''}<button class="btn" onclick="showTab('nursery')">Посмотреть дракона</button></div>`}
function arena(){return `<section class="section"><div class="sectionHead"><h2>АРЕНА ДРАКОНОВ</h2><span class="muted">PvE · тренировочный режим</span></div><div class="hero" style="min-height:180px;background:linear-gradient(110deg,#301c36,#542d46,#1b3454)"><div class="heroText"><div class="eyebrow">THE CRUCIBLE</div><h1 style="font-size:30px">ВЫЗОВ ПРИНЯТ</h1><p>Проверь силу своей генетической линии в поединке с хранителем арены.</p><button class="btn" onclick="fight()">Начать бой ⚔</button></div><div class="dragonArt" style="font-size:125px">🐉</div></div><div id="fightResult"></div><div class="notice">Сила зависит от уровня, мутаций и сочетания частей. Редкость сама по себе не гарантирует победу. Онлайн PvP подключим через серверный этап.</div></section>`}
function fight(){if(!state.dragons.length)return;const d=state.dragons[Math.floor(Math.random()*state.dragons.length)],enemy=38+Math.floor(Math.random()*55),score=d.power+d.level*5+d.genes.length*4+Math.floor(Math.random()*20),won=score>=enemy; if(won){state.wins++;state.gems+=12;state.food+=5}else{state.gems+=3}save();document.getElementById('fightResult').innerHTML=`<div class="card" style="margin-top:14px;text-align:center"><div style="font-size:45px">${won?'🏆':'🛡️'}</div><h2 style="font:700 20px Cinzel;color:${won?'var(--gold)':'var(--cyan)'}">${won?'ПОБЕДА!':'ДОСТОЙНЫЙ БОЙ'}</h2><p class="muted">${d.name}: мощь ${score} · противник: ${enemy}</p><p>${won?'Награда: +12 ✦ и +5 ◈':'Награда за участие: +3 ✦'}</p></div>`}
function collection(){const found=sets.filter(s=>state.dragons.some(d=>d.set===s.id||s.parts.every(p=>[d.head,d.tail,d.wings].includes(p))));return `<section class="section"><div class="sectionHead"><h2>АРХИВ ДРЕВНИХ НАБОРОВ</h2><span class="muted">${found.length}/${sets.length} открыто</span></div><div class="collection">${sets.map(s=>{let owned=found.includes(s);return `<div class="set" style="opacity:${owned?1:.48}"><div class="icon">${owned?s.icon:'🔒'}</div><h3>${owned?s.name:'Неизведанный набор'}</h3><p>${owned?'Полный комплект обнаружен':'Собери три части одного набора'}</p>${s.parts.map(p=>`<p>✧ ${owned?p:'???'}</p>`).join('')}</div>`}).join('')}</div><div class="notice">Полный комплект из головы, хвоста и крыльев одного набора открывает коллекционную карточку и даёт +22 к силе в текущей версии.</div></section>`}
showTab('home');save();
</script><script src="world.js?v=2"></script></body></html>
